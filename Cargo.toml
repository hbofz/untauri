[package]
name = "untauri"
version = "0.5.1"
edition = "2021"
description = "Extract, inspect and patch the web frontend inside compiled Tauri apps."
license = "MIT"
repository = "https://github.com/hbofz/untauri"
readme = "README.md"
keywords = ["tauri", "reverse-engineering", "unpacker", "extract", "frontend"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
brotli = "6"
object = "0.36"
clap = { version = "4", features = ["derive"] }
anstyle-query = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
object = { version = "0.36", features = ["write"] }
